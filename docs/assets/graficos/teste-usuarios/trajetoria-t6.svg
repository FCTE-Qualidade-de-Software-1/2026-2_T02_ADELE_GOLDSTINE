<svg xmlns="http://www.w3.org/2000/svg" class="tu" viewBox="0 0 720 490" width="720" height="490" role="img" aria-label="A armadilha do calendário acadêmico (T6)" preserveAspectRatio="xMinYMin meet"><style>.tu text{font-family:var(--md-text-font-family,-apple-system,'Helvetica Neue',Arial,sans-serif);font-size:12px;fill:var(--md-default-fg-color--light, #52514e)}.tu .tinta{fill:var(--md-default-fg-color, #0b0b0b)}.tu .forte{fill:var(--md-default-fg-color, #0b0b0b);font-weight:700}.tu .num{font-variant-numeric:tabular-nums}.tu .valor{fill:var(--md-default-fg-color, #0b0b0b);font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--md-default-bg-color, #fcfcfb);stroke-width:3px;stroke-linejoin:round}.tu .grade{stroke:var(--viz-grade,#e1e0d9);stroke-width:1}.tu .base{stroke:var(--viz-base,#c3c2b7);stroke-width:1}.tu .limite{stroke:var(--viz-limite,#52514e);stroke-width:1.5;stroke-dasharray:5 4}.tu .fundo{fill:var(--md-default-bg-color, #fcfcfb)}.tu .anel{stroke:var(--md-default-bg-color, #fcfcfb);stroke-width:2}.tu .alvo{fill:transparent;pointer-events:all}.tu .alvo:hover{fill:var(--md-default-fg-color--lightest,#0000001a);fill-opacity:.35}.tu .s1{fill:var(--viz-1,#2a78d6)}.tu .l1{stroke:var(--viz-1,#2a78d6)}.tu .s2{fill:var(--viz-2,#eb6834)}.tu .l2{stroke:var(--viz-2,#eb6834)}.tu .s3{fill:var(--viz-3,#1baf7a)}.tu .l3{stroke:var(--viz-3,#1baf7a)}.tu .s4{fill:var(--viz-4,#eda100)}.tu .l4{stroke:var(--viz-4,#eda100)}.tu .s5{fill:var(--viz-5,#e87ba4)}.tu .l5{stroke:var(--viz-5,#e87ba4)}.tu .s6{fill:var(--viz-6,#008300)}.tu .l6{stroke:var(--viz-6,#008300)}.tu .s7{fill:var(--viz-7,#6250d6)}.tu .l7{stroke:var(--viz-7,#6250d6)}.tu .s8{fill:var(--viz-8,#e34948)}.tu .l8{stroke:var(--viz-8,#e34948)}.tu .ruim{fill:#e34948}.tu .bom{fill:#2a78d6}</style><rect class="fundo" x="0" y="0" width="720" height="490"/><text class="forte" x="16" y="26" style="font-size:17px">A armadilha do calendário acadêmico (T6)</text><text x="16" y="48" style="font-size:13px">Por onde os participantes tentaram chegar ao calendário, e onde chegaram?</text><rect class="s1" x="16" y="66" width="12" height="12" rx="3"/><text x="34" y="76">Caminho pelo menu Ensino</text><rect class="s2" x="204.39999999999998" y="66" width="12" height="12" rx="3"/><text x="222.39999999999998" y="76">Link do portal para o site da SAA</text><text class="forte" x="16" y="102">Início</text><text class="forte" x="250" y="102">Primeiro clique</text><text class="forte" x="520" y="102">Resultado</text><path class="s1" fill-opacity=".35" d="M30.0,209.0 C140.0,209.0 140.0,172.0 250.0,172.0 V240.0 C140.0,240.0 140.0,277.0 30.0,277.0 Z"><title>Menu Ensino &gt; Calendário Acadêmico: 2 de 5</title></path><path class="s2" fill-opacity=".35" d="M30.0,277.0 C140.0,277.0 140.0,314.0 250.0,314.0 V416.0 C140.0,416.0 140.0,379.0 30.0,379.0 Z"><title>Link &quot;Calendário Acadêmico de Graduação&quot; do portal: 3 de 5</title></path><path class="s1" fill-opacity=".35" d="M264.0,172.0 C392.0,172.0 392.0,172.0 520.0,172.0 V240.0 C392.0,240.0 392.0,240.0 264.0,240.0 Z"><title>P1, P2: Menu Ensino &gt; Calendário Acadêmico → Abriu o calendário 2026.2 no SIGAA</title></path><text class="tinta" x="272" y="210.0" style="font-size:11px">P1, P2</text><path class="s2" fill-opacity=".35" d="M264.0,314.0 C392.0,314.0 392.0,240.0 520.0,240.0 V274.0 C392.0,274.0 392.0,348.0 264.0,348.0 Z"><title>P6: Link &quot;Calendário Acadêmico de Graduação&quot; do portal → Abriu o calendário 2026.2 no SIGAA (voltou ao SIGAA)</title></path><text class="tinta" x="272" y="335.0" style="font-size:11px">P6 (voltou ao SIGAA)</text><path class="s2" fill-opacity=".35" d="M264.0,348.0 C392.0,348.0 392.0,292.0 520.0,292.0 V326.0 C392.0,326.0 392.0,382.0 264.0,382.0 Z"><title>P4: Link &quot;Calendário Acadêmico de Graduação&quot; do portal → Usou o calendário fora do SIGAA</title></path><text class="tinta" x="272" y="369.0" style="font-size:11px">P4</text><path class="s2" fill-opacity=".35" d="M264.0,382.0 C392.0,382.0 392.0,344.0 520.0,344.0 V378.0 C392.0,378.0 392.0,416.0 264.0,416.0 Z"><title>P3: Link &quot;Calendário Acadêmico de Graduação&quot; do portal → Desistiu</title></path><text class="tinta" x="272" y="403.0" style="font-size:11px">P3</text><rect x="16" y="209.0" width="14" height="170" rx="3" style="fill:var(--md-default-fg-color, #0b0b0b)"/><text class="tinta" x="16" y="397.0" style="font-weight:700">5 participantes</text><rect class="s1" x="250" y="172.0" width="14" height="68" rx="3"/><text class="tinta" x="250" y="149.0" style="font-weight:700">Menu Ensino &gt; Calendário Acadêmico (2)</text><text class="tinta" x="250" y="164.0" style="font-size:11px">caminho do SIGAA</text><rect class="s2" x="250" y="314.0" width="14" height="102" rx="3"/><text class="tinta" x="250" y="261.0" style="font-weight:700">Link &quot;Calendário Acadêmico de Graduação&quot;</text><text class="tinta" x="250" y="276.0" style="font-weight:700">do portal (3)</text><text class="tinta" x="250" y="291.0" style="font-size:11px">abre o site da SAA, na página de</text><text class="tinta" x="250" y="306.0" style="font-size:11px">Pós-Graduação</text><rect x="520" y="172.0" width="14" height="102" rx="3" style="fill:var(--md-default-fg-color, #0b0b0b)"/><text class="tinta" x="544" y="219.5" style="font-weight:700">3 · Abriu o calendário</text><text class="tinta" x="544" y="234.5">2026.2 no SIGAA</text><rect x="520" y="292.0" width="14" height="34" rx="3" style="fill:var(--md-default-fg-color, #0b0b0b)"/><text class="tinta" x="544" y="305.5" style="font-weight:700">1 · Usou o calendário</text><text class="tinta" x="544" y="320.5">fora do SIGAA</text><rect x="520" y="344.0" width="14" height="34" rx="3" style="fill:var(--md-default-fg-color, #0b0b0b)"/><text class="tinta" x="544" y="365.0" style="font-weight:700">1 · Desistiu</text><text x="16" y="442" style="font-size:11px">Trajetória de cada participante em T6, pela análise das gravações. O link do painel do portal leva à página de</text><text x="16" y="456" style="font-size:11px">Pós-Graduação do site da SAA: dos 3 que caíram nele, um voltou ao SIGAA e concluiu, um usou o calendário fora do SIGAA</text><text x="16" y="470" style="font-size:11px">(não conta como conclusão) e um desistiu. A largura de cada faixa é o número de participantes.</text></svg>