<svg xmlns="http://www.w3.org/2000/svg" class="tu" viewBox="0 0 720 450" width="720" height="450" role="img" aria-label="O que os estudantes acham fácil nem sempre é o que conseguem fazer" preserveAspectRatio="xMinYMin meet"><style>.tu text{font-family:var(--md-text-font-family,-apple-system,'Helvetica Neue',Arial,sans-serif);font-size:12px;fill:var(--md-default-fg-color--light, #52514e)}.tu .tinta{fill:var(--md-default-fg-color, #0b0b0b)}.tu .forte{fill:var(--md-default-fg-color, #0b0b0b);font-weight:700}.tu .num{font-variant-numeric:tabular-nums}.tu .valor{fill:var(--md-default-fg-color, #0b0b0b);font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--md-default-bg-color, #fcfcfb);stroke-width:3px;stroke-linejoin:round}.tu .grade{stroke:var(--viz-grade,#e1e0d9);stroke-width:1}.tu .base{stroke:var(--viz-base,#c3c2b7);stroke-width:1}.tu .limite{stroke:var(--viz-limite,#52514e);stroke-width:1.5;stroke-dasharray:5 4}.tu .fundo{fill:var(--md-default-bg-color, #fcfcfb)}.tu .anel{stroke:var(--md-default-bg-color, #fcfcfb);stroke-width:2}.tu .alvo{fill:transparent;pointer-events:all}.tu .alvo:hover{fill:var(--md-default-fg-color--lightest,#0000001a);fill-opacity:.35}.tu .s1{fill:var(--viz-1,#2a78d6)}.tu .l1{stroke:var(--viz-1,#2a78d6)}.tu .s2{fill:var(--viz-2,#eb6834)}.tu .l2{stroke:var(--viz-2,#eb6834)}.tu .s3{fill:var(--viz-3,#1baf7a)}.tu .l3{stroke:var(--viz-3,#1baf7a)}.tu .s4{fill:var(--viz-4,#eda100)}.tu .l4{stroke:var(--viz-4,#eda100)}.tu .s5{fill:var(--viz-5,#e87ba4)}.tu .l5{stroke:var(--viz-5,#e87ba4)}.tu .s6{fill:var(--viz-6,#008300)}.tu .l6{stroke:var(--viz-6,#008300)}.tu .s7{fill:var(--viz-7,#6250d6)}.tu .l7{stroke:var(--viz-7,#6250d6)}.tu .s8{fill:var(--viz-8,#e34948)}.tu .l8{stroke:var(--viz-8,#e34948)}.tu .ruim{fill:#e34948}.tu .bom{fill:#2a78d6}</style><rect class="fundo" x="0" y="0" width="720" height="450"/><text class="forte" x="16" y="26" style="font-size:17px">O que os estudantes acham fácil nem sempre é o que conseguem fazer</text><text x="16" y="48" style="font-size:13px">A facilidade relatada no questionário bate com o desempenho na sessão?</text><line class="base" x1="70.0" x2="70.0" y1="76.0" y2="346.0"/><text class="num" x="70.0" y="362.0" text-anchor="middle">1</text><line class="grade" x1="225.0" x2="225.0" y1="76.0" y2="346.0"/><text class="num" x="225.0" y="362.0" text-anchor="middle">2</text><line class="grade" x1="380.0" x2="380.0" y1="76.0" y2="346.0"/><text class="num" x="380.0" y="362.0" text-anchor="middle">3</text><line class="grade" x1="535.0" x2="535.0" y1="76.0" y2="346.0"/><text class="num" x="535.0" y="362.0" text-anchor="middle">4</text><line class="grade" x1="690.0" x2="690.0" y1="76.0" y2="346.0"/><text class="num" x="690.0" y="362.0" text-anchor="middle">5</text><text x="70.0" y="380.0">muito difícil</text><text x="690.0" y="380.0" text-anchor="end">muito fácil</text><text x="380.0" y="380.0" text-anchor="middle">facilidade percebida no questionário (mediana, C1)</text><line class="base" x1="70.0" x2="690.0" y1="346.0" y2="346.0"/><text class="num" x="62" y="350.0" text-anchor="end">0%</text><line class="grade" x1="70.0" x2="690.0" y1="292.0" y2="292.0"/><text class="num" x="62" y="296.0" text-anchor="end">20%</text><line class="grade" x1="70.0" x2="690.0" y1="238.0" y2="238.0"/><text class="num" x="62" y="242.0" text-anchor="end">40%</text><line class="grade" x1="70.0" x2="690.0" y1="184.0" y2="184.0"/><text class="num" x="62" y="188.0" text-anchor="end">60%</text><line class="grade" x1="70.0" x2="690.0" y1="130.0" y2="130.0"/><text class="num" x="62" y="134.0" text-anchor="end">80%</text><line class="grade" x1="70.0" x2="690.0" y1="76.0" y2="76.0"/><text class="num" x="62" y="80.0" text-anchor="end">100%</text><text x="62" y="68" text-anchor="end">concluíram</text><circle class="s1 anel" cx="690.0" cy="76.0" r="8"><title>T1 Notas: facilidade 5,0, 100% concluíram</title></circle><text class="valor" x="676.0" y="80.0" text-anchor="end">T1 Notas</text><circle class="s1 anel" cx="535.0" cy="76.0" r="8"><title>T2 Horário e local, T3 Atestado: facilidade 4,0, 100% concluíram</title></circle><text class="valor" x="521.0" y="80.0" text-anchor="end">T2 Horário e local e T3 Atestado</text><circle class="s1 anel" cx="535.0" cy="184.0" r="8"><title>T4 O que falta para formar: facilidade 4,0, 60% concluíram</title></circle><text class="valor" x="521.0" y="188.0" text-anchor="end">T4 O que falta para formar</text><circle class="s1 anel" cx="690.0" cy="130.0" r="8"><title>T5 Material da turma: facilidade 5,0, 80% concluíram</title></circle><text class="valor" x="676.0" y="134.0" text-anchor="end">T5 Material da turma</text><circle class="s1 anel" cx="225.0" cy="184.0" r="8"><title>T6 Calendário: facilidade 2,0, 60% concluíram</title></circle><text class="valor" x="239.0" y="188.0" text-anchor="start">T6 Calendário</text><text x="16" y="402" style="font-size:11px">Em T4 os estudantes dizem que a tarefa é fácil (mediana 4), mas 2 de 5 não a concluíram: a dificuldade não é</text><text x="16" y="416" style="font-size:11px">percebida. Em T6 a percepção (mediana 2) e o desempenho concordam. Facilidade de 1 a 5, ignorando &quot;nunca fiz&quot;;</text><text x="16" y="430" style="font-size:11px">conclusão sem ajuda na sessão (M5 por tarefa).</text></svg>