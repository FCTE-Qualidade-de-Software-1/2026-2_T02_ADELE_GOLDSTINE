<svg xmlns="http://www.w3.org/2000/svg" class="tu" viewBox="0 0 720 430" width="720" height="430" role="img" aria-label="Como o SIGAA se saiu em cada métrica do teste com usuários" preserveAspectRatio="xMinYMin meet"><style>.tu text{font-family:var(--md-text-font-family,-apple-system,'Helvetica Neue',Arial,sans-serif);font-size:12px;fill:var(--md-default-fg-color--light, #52514e)}.tu .tinta{fill:var(--md-default-fg-color, #0b0b0b)}.tu .forte{fill:var(--md-default-fg-color, #0b0b0b);font-weight:700}.tu .num{font-variant-numeric:tabular-nums}.tu .valor{fill:var(--md-default-fg-color, #0b0b0b);font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--md-default-bg-color, #fcfcfb);stroke-width:3px;stroke-linejoin:round}.tu .grade{stroke:var(--viz-grade,#e1e0d9);stroke-width:1}.tu .base{stroke:var(--viz-base,#c3c2b7);stroke-width:1}.tu .limite{stroke:var(--viz-limite,#52514e);stroke-width:1.5;stroke-dasharray:5 4}.tu .fundo{fill:var(--md-default-bg-color, #fcfcfb)}.tu .anel{stroke:var(--md-default-bg-color, #fcfcfb);stroke-width:2}.tu .alvo{fill:transparent;pointer-events:all}.tu .alvo:hover{fill:var(--md-default-fg-color--lightest,#0000001a);fill-opacity:.35}.tu .s1{fill:var(--viz-1,#2a78d6)}.tu .l1{stroke:var(--viz-1,#2a78d6)}.tu .s2{fill:var(--viz-2,#eb6834)}.tu .l2{stroke:var(--viz-2,#eb6834)}.tu .s3{fill:var(--viz-3,#1baf7a)}.tu .l3{stroke:var(--viz-3,#1baf7a)}.tu .s4{fill:var(--viz-4,#eda100)}.tu .l4{stroke:var(--viz-4,#eda100)}.tu .s5{fill:var(--viz-5,#e87ba4)}.tu .l5{stroke:var(--viz-5,#e87ba4)}.tu .s6{fill:var(--viz-6,#008300)}.tu .l6{stroke:var(--viz-6,#008300)}.tu .s7{fill:var(--viz-7,#6250d6)}.tu .l7{stroke:var(--viz-7,#6250d6)}.tu .s8{fill:var(--viz-8,#e34948)}.tu .l8{stroke:var(--viz-8,#e34948)}.tu .ruim{fill:#e34948}.tu .bom{fill:#2a78d6}</style><rect class="fundo" x="0" y="0" width="720" height="430"/><text class="forte" x="16" y="26" style="font-size:17px">Como o SIGAA se saiu em cada métrica do teste com usuários</text><text x="16" y="48" style="font-size:13px">Onde cada resultado caiu nas faixas definidas antes da coleta?</text><rect class="ruim" x="250.0" y="86" width="75.5" height="278" rx="4" fill-opacity="0.3"/><text class="forte" x="288.8" y="78" text-anchor="middle">Insatisfatório</text><rect class="ruim" x="327.5" y="86" width="75.5" height="278" rx="4" fill-opacity="0.13"/><text class="forte" x="366.2" y="78" text-anchor="middle">Regular</text><rect class="bom" x="405.0" y="86" width="75.5" height="278" rx="4" fill-opacity="0.13"/><text class="forte" x="443.8" y="78" text-anchor="middle">Bom</text><rect class="bom" x="482.5" y="86" width="75.5" height="278" rx="4" fill-opacity="0.3"/><text class="forte" x="521.2" y="78" text-anchor="middle">Excelente</text><text x="250.0" y="78" text-anchor="end" dx="-8">pior ←</text><text x="560.0" y="78" dx="6">→ melhor</text><text class="tinta" x="12" y="113.0"><tspan class="forte">M3</tspan>  Uso de ferramenta externa</text><line class="grade" x1="250.0" x2="560.0" y1="109.0" y2="109.0"/><circle class="anel" cx="312.0" cy="109.0" r="7" style="fill:var(--md-default-fg-color, #0b0b0b)"/><text class="valor" x="572" y="113.0" style="font-weight:700">60%</text><text x="624" y="113.0">Insatisfatório</text><rect class="alvo" x="0" y="92.0" width="720" height="34"><title>M3 Uso de ferramenta externa: 60% (Insatisfatório). Insatisfatório: 100% a 50%; Regular: 50% a 25%; Bom: 25% a 10%; Excelente: 10% a 0%</title></rect><text class="tinta" x="12" y="147.0"><tspan class="forte">M4</tspan>  Acerto na primeira escolha de menu</text><line class="grade" x1="250.0" x2="560.0" y1="143.0" y2="143.0"/><circle class="anel" cx="399.8" cy="143.0" r="7" style="fill:var(--md-default-fg-color, #0b0b0b)"/><text class="valor" x="572" y="147.0" style="font-weight:700">73,3%</text><text x="624" y="147.0">Regular</text><rect class="alvo" x="0" y="126.0" width="720" height="34"><title>M4 Acerto na primeira escolha de menu: 73,3% (Regular). Insatisfatório: 0% a 50%; Regular: 50% a 75%; Bom: 75% a 90%; Excelente: 90% a 100%</title></rect><text class="tinta" x="12" y="181.0"><tspan class="forte">M5</tspan>  Tarefas concluídas sem ajuda</text><line class="grade" x1="250.0" x2="560.0" y1="177.0" y2="177.0"/><circle class="anel" cx="439.4" cy="177.0" r="7" style="fill:var(--md-default-fg-color, #0b0b0b)"/><text class="valor" x="572" y="181.0" style="font-weight:700">83,3%</text><text x="624" y="181.0">Bom</text><rect class="alvo" x="0" y="160.0" width="720" height="34"><title>M5 Tarefas concluídas sem ajuda: 83,3% (Bom). Insatisfatório: 0% a 60%; Regular: 60% a 78%; Bom: 78% a 90%; Excelente: 90% a 100%</title></rect><text class="tinta" x="12" y="215.0"><tspan class="forte">M6</tspan>  Tempo em relação ao especialista</text><line class="grade" x1="250.0" x2="560.0" y1="211.0" y2="211.0"/><circle class="anel" cx="320.0" cy="211.0" r="7" style="fill:var(--md-default-fg-color, #0b0b0b)"/><text class="valor" x="572" y="215.0" style="font-weight:700">4,39×</text><text x="624" y="215.0">Insatisfatório</text><rect class="alvo" x="0" y="194.0" width="720" height="34"><title>M6 Tempo em relação ao especialista: 4,39× (Insatisfatório). Insatisfatório: 8,00× a 4,00×; Regular: 4,00× a 2,50×; Bom: 2,50× a 1,50×; Excelente: 1,50× a 1,00×</title></rect><text class="tinta" x="12" y="249.0"><tspan class="forte">M7</tspan>  Cliques em relação ao caminho mínimo</text><line class="grade" x1="250.0" x2="560.0" y1="245.0" y2="245.0"/><circle class="anel" cx="389.4" cy="245.0" r="7" style="fill:var(--md-default-fg-color, #0b0b0b)"/><text class="valor" x="572" y="249.0" style="font-weight:700">1,46×</text><text x="624" y="249.0">Regular</text><rect class="alvo" x="0" y="228.0" width="720" height="34"><title>M7 Cliques em relação ao caminho mínimo: 1,46× (Regular). Insatisfatório: 3,00× a 2,00×; Regular: 2,00× a 1,33×; Bom: 1,33× a 1,11×; Excelente: 1,11× a 1,00×</title></rect><text class="tinta" x="12" y="283.0"><tspan class="forte">M8</tspan>  Erros recuperados sem ajuda</text><line class="grade" x1="250.0" x2="560.0" y1="279.0" y2="279.0"/><circle class="anel" cx="448.6" cy="279.0" r="7" style="fill:var(--md-default-fg-color, #0b0b0b)"/><text class="valor" x="572" y="283.0" style="font-weight:700">81,2%</text><text x="624" y="283.0">Bom</text><rect class="alvo" x="0" y="262.0" width="720" height="34"><title>M8 Erros recuperados sem ajuda: 81,2% (Bom). Insatisfatório: 0% a 50%; Regular: 50% a 70%; Bom: 70% a 90%; Excelente: 90% a 100%</title></rect><text class="tinta" x="12" y="317.0"><tspan class="forte">M11</tspan>  Leitura correta sem legenda</text><line class="grade" x1="250.0" x2="560.0" y1="313.0" y2="313.0"/><circle class="anel" cx="337.8" cy="313.0" r="7" style="fill:var(--md-default-fg-color, #0b0b0b)"/><text class="valor" x="572" y="317.0" style="font-weight:700">53,3%</text><text x="624" y="317.0">Regular</text><rect class="alvo" x="0" y="296.0" width="720" height="34"><title>M11 Leitura correta sem legenda: 53,3% (Regular). Insatisfatório: 0% a 50%; Regular: 50% a 75%; Bom: 75% a 90%; Excelente: 90% a 100%</title></rect><text class="tinta" x="12" y="351.0"><tspan class="forte">M12</tspan>  Satisfação (SUS, 0 a 100)</text><line class="grade" x1="250.0" x2="560.0" y1="347.0" y2="347.0"/><circle class="anel" cx="299.4" cy="347.0" r="7" style="fill:var(--md-default-fg-color, #0b0b0b)"/><text class="valor" x="572" y="351.0" style="font-weight:700">32,5</text><text x="624" y="351.0">Insatisfatório</text><rect class="alvo" x="0" y="330.0" width="720" height="34"><title>M12 Satisfação (SUS, 0 a 100): 32,5 (Insatisfatório). Insatisfatório: 0,0 a 51,0; Regular: 51,0 a 68,0; Bom: 68,0 a 80,3; Excelente: 80,3 a 100,0</title></rect><text x="16" y="382" style="font-size:11px">Cada faixa tem a mesma largura; o ponto fica na posição do valor dentro da faixa. Níveis da página Níveis de Pontuação</text><text x="16" y="396" style="font-size:11px">(Fase 2). M6 e M7 em vezes o especialista e o caminho mínimo; nas faixas abertas, o extremo do desenho é só um limite</text><text x="16" y="410" style="font-size:11px">visual. Teste com 5 participantes (P1, P2, P3, P4 e P6).</text></svg>