422.0,212.0 418.0,212.0 H270.0 Z"><title>Não conseguiu concluir o que queria: 2 de 5</title></path><text class="valor" x="430.0" y="205.0" style="font-weight:700">2 de 5</text><text class="tinta" x="12" y="243.0">Conteúdo cortado ou sobreposto</text><path class="s1" d="M270.0,228.0 H342.0 Q346.0,228.0 346.0,232.0 V246.0 Q346.0,250.0 342.0,250.0 H270.0 Z"><title>Conteúdo cortado ou sobreposto: 1 de 5</title></path><text class="valor" x="354.0" y="243.0" style="font-weight:700">1 de 5</text><text x="16" y="308" style="font-size:11px">Respostas ao item B5 do questionário (vários podiam ser marcados). Todos os 5 participantes usam o SIGAA no celular.</text><text x="16" y="322" style="font-size:11px">Na inspeção, nenhuma das 6 páginas do escopo se adapta a 360 px ou 768 px (M14 = 0 de 12): o layout fixo de 980 px é</text><text x="16" y="336" style="font-size:11px">reduzido e o texto chega a cerca de 3 px.</text></svg>