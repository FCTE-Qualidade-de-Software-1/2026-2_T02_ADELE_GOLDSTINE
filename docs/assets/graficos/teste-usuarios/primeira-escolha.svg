<svg xmlns="http://www.w3.org/2000/svg" class="tu" viewBox="0 0 720 432" width="720" height="432" role="img" aria-label="Onde os estudantes clicam primeiro" preserveAspectRatio="xMinYMin meet"><style>.tu text{font-family:var(--md-text-font-family,-apple-system,'Helvetica Neue',Arial,sans-serif);font-size:12px;fill:var(--md-default-fg-color--light, #52514e)}.tu .tinta{fill:var(--md-default-fg-color, #0b0b0b)}.tu .forte{fill:var(--md-default-fg-color, #0b0b0b);font-weight:700}.tu .num{font-variant-numeric:tabular-nums}.tu .valor{fill:var(--md-default-fg-color, #0b0b0b);font-variant-numeric:tabular-nums;paint-order:stroke;stroke:var(--md-default-bg-color, #fcfcfb);stroke-width:3px;stroke-linejoin:round}.tu .grade{stroke:var(--viz-grade,#e1e0d9);stroke-width:1}.tu .base{stroke:var(--viz-base,#c3c2b7);stroke-width:1}.tu .limite{stroke:var(--viz-limite,#52514e);stroke-width:1.5;stroke-dasharray:5 4}.tu .fundo{fill:var(--md-default-bg-color, #fcfcfb)}.tu .anel{stroke:var(--md-default-bg-color, #fcfcfb);stroke-width:2}.tu .alvo{fill:transparent;pointer-events:all}.tu .alvo:hover{fill:var(--md-default-fg-color--lightest,#0000001a);fill-opacity:.35}.tu .s1{fill:var(--viz-1,#2a78d6)}.tu .l1{stroke:var(--viz-1,#2a78d6)}.tu .s2{fill:var(--viz-2,#eb6834)}.tu .l2{stroke:var(--viz-2,#eb6834)}.tu .s3{fill:var(--viz-3,#1baf7a)}.tu .l3{stroke:var(--viz-3,#1baf7a)}.tu .s4{fill:var(--viz-4,#eda100)}.tu .l4{stroke:var(--viz-4,#eda100)}.tu .s5{fill:var(--viz-5,#e87ba4)}.tu .l5{stroke:var(--viz-5,#e87ba4)}.tu .s6{fill:var(--viz-6,#008300)}.tu .l6{stroke:var(--viz-6,#008300)}.tu .s7{fill:var(--viz-7,#6250d6)}.tu .l7{stroke:var(--viz-7,#6250d6)}.tu .s8{fill:var(--viz-8,#e34948)}.tu .l8{stroke:var(--viz-8,#e34948)}.tu .ruim{fill:#e34948}.tu .bom{fill:#2a78d6}</style><rect class="fundo" x="0" y="0" width="720" height="432"/><text class="forte" x="16" y="26" style="font-size:17px">Onde os estudantes clicam primeiro</text><text x="16" y="48" style="font-size:13px">O primeiro clique de cada taref